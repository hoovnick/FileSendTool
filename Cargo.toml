[package]
name = "fst"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
arboard = "3.7.0"
axum = "0.8.9"
chrono = "0.4.45"
eframe = "0.37.0"
egui = "0.37.0"
open = "5.4.5"
percent-encoding = "2.3.2"
qrcode = "0.15.0"
rand = "0.10.4"
rfd = "0.18.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "net"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
